<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stock Monitor – IAT</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f3f4f6;--card:#ffffff;--text:#1b1f24;--muted:#6b7280;--border:#e2e5ea;--accent:#1f6feb;--accent-t:#fff;
--ok:#16803c;--okbg:#e4f5ea;--low:#b45309;--lowbg:#fff0d6;--out:#c42318;--outbg:#fde7e5;--nom:#5f6672;--nombg:#eceef2;--inp:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111418;--card:#1b2027;--text:#e8eaed;--muted:#9aa3af;--border:#2c333c;--accent:#4c8dff;--accent-t:#fff;
--ok:#4ade80;--okbg:#12301f;--low:#fbbf24;--lowbg:#3a2a0c;--out:#ff7b72;--outbg:#3c1714;--nom:#aab1bc;--nombg:#262c35;--inp:#12161b}}
:root[data-theme="dark"]{--bg:#111418;--card:#1b2027;--text:#e8eaed;--muted:#9aa3af;--border:#2c333c;--accent:#4c8dff;--accent-t:#fff;
--ok:#4ade80;--okbg:#12301f;--low:#fbbf24;--lowbg:#3a2a0c;--out:#ff7b72;--outbg:#3c1714;--nom:#aab1bc;--nombg:#262c35;--inp:#12161b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;font-size:15px;line-height:1.45}
#app{max-width:1100px;margin:0 auto;padding:12px 12px 90px}
button{font-family:inherit;font-size:14px;cursor:pointer;border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:10px;padding:8px 12px}
button.pri{background:var(--accent);color:var(--accent-t);border-color:var(--accent);font-weight:700}
button.dan{color:var(--out);border-color:var(--out)}
input,select,textarea{font-family:inherit;font-size:15px;background:var(--inp);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:9px 10px;width:100%}
h1{font-size:20px;margin:0}
.hdr{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:10px}
.hdr .sub{color:var(--muted);font-size:13px}
.hbtns{display:flex;gap:6px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.stat{background:var(--card);border:2px solid var(--border);border-radius:12px;padding:8px 6px;text-align:center;cursor:pointer}
.stat b{display:block;font-size:22px}
.stat span{font-size:12px;color:var(--muted)}
.stat.on{border-color:var(--accent)}
.stat.low b{color:var(--low)}.stat.out b{color:var(--out)}.stat.ok b{color:var(--ok)}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1;font-weight:700}
.tabs button.on{background:var(--accent);color:var(--accent-t);border-color:var(--accent)}
.tabs .cnt{display:inline-block;min-width:20px;background:var(--out);color:#fff;border-radius:10px;font-size:12px;padding:0 6px;margin-inline-start:4px}
.bar{display:flex;gap:8px;margin-bottom:8px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px}
.chip{white-space:nowrap;border-radius:20px;padding:6px 12px;font-size:13px}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.gh{margin:14px 0 6px;font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px}
.gh small{color:var(--muted);font-weight:400}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px}
.card{background:var(--card);border:1px solid var(--border);border-inline-start:6px solid var(--nom);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
.card.s-ok{border-inline-start-color:var(--ok)}
.card.s-low{border-inline-start-color:var(--low);background:var(--lowbg)}
.card.s-out{border-inline-start-color:var(--out);background:var(--outbg)}
.top{display:flex;gap:10px;align-items:center;cursor:pointer}
.th{width:54px;height:54px;border-radius:10px;object-fit:cover;flex:none;background:var(--nombg)}
.th.ph{display:flex;align-items:center;justify-content:center;font-size:24px}
.nm{font-weight:700;word-break:break-word}
.ar{font-size:14px}
.meta{font-size:12px;color:var(--muted)}
.bot{display:flex;justify-content:space-between;align-items:center;gap:8px}
.qc{display:flex;align-items:center;gap:4px}
.qc button{width:38px;height:38px;padding:0;font-size:20px;font-weight:700}
.qin{width:72px;text-align:center;font-weight:700;font-size:18px;padding:6px}
.mn{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.minv{font-size:12px;color:var(--muted)}
.badge{font-size:12px;font-weight:700;border-radius:8px;padding:2px 8px}
.b-ok{background:var(--okbg);color:var(--ok)}.b-low{background:var(--lowbg);color:var(--low);border:1px solid var(--low)}
.b-out{background:var(--outbg);color:var(--out);border:1px solid var(--out)}.b-nomin{background:var(--nombg);color:var(--nom)}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.crow{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px;margin-bottom:6px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.crow.done{border-color:var(--ok)}
.cnt{display:flex;align-items:center;gap:8px}
.cnt input{width:92px;text-align:center;font-weight:700;font-size:18px}
.sys{font-size:13px;color:var(--muted)}
.diff{min-width:36px;font-weight:700;font-size:14px}
.diff.p{color:var(--ok)}.diff.n{color:var(--out)}
.sticky{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:6px 0;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.log{margin-top:16px;font-size:13px}
.log details{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:8px 10px;margin-bottom:6px}
.note{background:var(--nombg);border-radius:10px;padding:8px 10px;font-size:13px;color:var(--muted);margin-bottom:10px}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:none;align-items:flex-end;justify-content:center}
#ov.on{display:flex}
.mdl{background:var(--card);color:var(--text);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;padding:14px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
@media(min-width:640px){#ov{align-items:center}.mdl{border-radius:16px}}
.mdl h3{margin:0 0 10px}
.fld{margin-bottom:8px}.fld label{display:block;font-size:13px;color:var(--muted);margin-bottom:3px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mbtns{display:flex;gap:8px;justify-content:space-between;margin-top:12px;flex-wrap:wrap}
.imgrow{display:flex;gap:10px;align-items:center}
.imgrow .th{width:70px;height:70px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:#222;color:#fff;padding:9px 16px;border-radius:20px;z-index:99;font-size:14px;display:none;max-width:90%}
#printArea{display:none}
@media print{
 @page{size:A4 landscape;margin:9mm}
 body{background:#fff;color:#000}
 #app,#ov,#toast{display:none!important}
 #printArea{display:block;color:#000;font-size:11px}
 #printArea h2{margin:0 0 2px;font-size:16px}
 #printArea .pm{margin-bottom:6px;font-size:11px}
 #printArea h4{margin:10px 0 3px;font-size:13px;break-after:avoid}
 #printArea table{width:100%;border-collapse:collapse;margin-bottom:4px;break-inside:auto}
 #printArea tr{break-inside:avoid}
 #printArea th,#printArea td{border:1px solid #444;padding:3px 4px;text-align:center;vertical-align:middle}
 #printArea th{background:#e8e8e8}
 #printArea td.l{text-align:right}
 #printArea img{width:26px;height:26px;object-fit:cover}
 #printArea tr.blank td{height:26px}
}
</style>
</head>
<body>
<div id="app">
  <div class="hdr">
    <div><h1>📦 Stock Monitor</h1><div class="sub" id="lastc"></div><div class="sub" id="syncs"></div></div>
    <div class="hbtns">
      <button class="pri" id="bAdd">＋ Item</button>
      <button id="bPrint">🖨 Print</button>
      <button class="pri" id="bSave">☁ Save</button><button class="pri" id="bLoad">📂 Load</button><button id="bBackup" title="File settings">⚙</button>
    </div>
  </div>
  <div class="stats" id="stats"></div>
  <div class="tabs" id="tabs">
    <button data-v="stock">Stock</button>
    <button data-v="count">Count</button>
    <button data-v="need">Shortages <span class="cnt" id="needCnt">0</span></button>
  </div>
  <div id="filters">
    <div class="bar"><input id="q" type="search" placeholder="🔍 Search item, brand, size..."></div>
    <div class="chips" id="chips"></div>
  </div>
  <div id="view"></div>
</div>
<div id="printArea"></div>
<div id="ov"><div class="mdl" id="mdl"></div></div>
<div id="toast"></div>

const LBL={out:'Out of stock',low:'At / below min',ok:'OK',nomin:'No min set'};
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toLocaleDateString('en-CA');
const fmtD=d=>{if(!d)return '—';const p=d.split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:d};
const nid=()=>'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);

let S, ui={view:'stock',filter:'all',cat:'all',q:''}, draft={}, order={};

function seed(){return{cats:CATS.map(([id,name])=>({id,name})),items:SEED.map((r,i)=>({id:'s'+i,cat:r[0],name:r[1],ar:r[2],size:r[3],unit:r[4],brand:r[5],qty:r[6],min:r[7],img:r[8]>=0?IMGS[r[8]]:'',note:'',counted:'2026-09-25'})),lastCount:'2026-09-25',log:[]}}
function load(){try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);if(o&&Array.isArray(o.items)&&Array.isArray(o.cats)){S=o;if(!S.log)S.log=[];return}}}catch(e){}S=seed()}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Could not save in this browser (images may be too large)')}}
function save(){S.modified=new Date().toISOString();persist();renderSync()}
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',2600)}

function status(it){const q=+it.qty||0,m=+it.min||0;if(q<=0)return 'out';if(m>0&&q<=m)return 'low';if(m>0)return 'ok';return 'nomin'}
const sug=it=>{const m=+it.min||0;return m>0?Math.max(m*2-(+it.qty||0),0):0};
const catName=id=>(S.cats.find(c=>c.id===id)||{name:'Other'}).name;
function thumb(it,cls){return it.img?`<img class="${cls}" src="${it.img}" alt="">`:`<div class="${cls} ph">📦</div>`}
function info(it){return `${thumb(it,'th')}<div class="info"><div class="nm">${esc(it.name)}</div>${it.ar?`<div class="ar">${esc(it.ar)}</div>`:''}<div class="meta">${[it.size,it.unit,it.brand].filter(Boolean).map(esc).join(' · ')}</div></div>`}

function visible(forCount){
  const q=ui.q.trim().toLowerCase();
  return S.items.filter(it=>{
    if(ui.cat!=='all'&&it.cat!==ui.cat)return false;
    if(!forCount&&ui.filter!=='all'&&status(it)!==ui.filter)return false;
    if(q&&!(it.name+' '+it.ar+' '+it.brand+' '+it.size).toLowerCase().includes(q))return false;
    return true;
  });
}
function groups(list){return S.cats.map(c=>({c,items:list.filter(i=>i.cat===c.id)})).filter(g=>g.items.length)}

function renderStats(){
  const n={ok:0,low:0,out:0,nomin:0};S.items.forEach(i=>n[status(i)]++);
  const defs=[['all','All items',S.items.length,''],['ok','OK',n.ok+n.nomin,'ok'],['low','Low',n.low,'low'],['out','Out',n.out,'out']];
  $('#stats').innerHTML=defs.map(d=>`<div class="stat ${d[3]} ${ui.filter===d[0]?'on':''}" data-f="${d[0]}"><b>${d[2]}</b><span>${d[1]}</span></div>`).join('');
  $('#needCnt').textContent=n.low+n.out;
  $('#lastc').textContent='Last count: '+fmtD(S.lastCount);renderSync();
}
function renderChips(){
  $('#chips').innerHTML=`<button class="chip ${ui.cat==='all'?'on':''}" data-c="all">All</button>`+S.cats.map(c=>`<button class="chip ${ui.cat===c.id?'on':''}" data-c="${c.id}">${esc(c.name)}</button>`).join('');
}
function fmtT(iso){if(!iso)return '—';const d=new Date(iso);return d.toLocaleDateString('en-GB')+' '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}
function renderSync(){const fs=localStorage.getItem('iat_stock_filesaved')||'';const el=$('#syncs');if(!el)return;
  const dirty=!fs||(S.modified&&S.modified>fs);
  const fn=localStorage.getItem('iat_stock_filename');el.innerHTML=fs?`${fn?'📄 '+esc(fn)+' · ':''}Saved: ${fmtT(fs)} ${dirty?'<b style="color:var(--low)">● changes not saved to file</b>':'<b style="color:var(--ok)">✔ up to date</b>'}`:'<b style="color:var(--low)">● never saved to a file yet</b>'}
function renderTabs(){document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===ui.view));$('#filters').style.display=ui.view==='need'?'none':''}

function stockHTML(){
  const g=groups(visible(false));
  if(!g.length)return '<div class="empty">No matching items</div>';
  return g.map(x=>`<div class="gh">${esc(x.c.name)} <small>(${x.items.length})</small></div><div class="grid">`+x.items.map(it=>{
    const st=status(it);
    return `<div class="card s-${st}" data-id="${it.id}"><div class="top" data-act="edit">${info(it)}</div>
    <div class="bot"><div class="qc"><button data-act="minus">−</button><input class="qin" inputmode="decimal" value="${it.qty}"><button data-act="plus">+</button></div>
    <div class="mn"><span class="badge b-${st}">${LBL[st]}</span><span class="minv">Min: ${+it.min>0?it.min:'—'}</span></div></div></div>`}).join('')+'</div>').join('');
}

function countHTML(){
  const list=visible(true);
  const filled=Object.keys(draft).filter(k=>draft[k]!==''&&!isNaN(parseFloat(draft[k]))).length;
  let h=`<div class="note">Enter the actual quantity you counted for each item. Items left blank stay unchanged. When finished, tap “Apply count”.</div>
  <div class="sticky"><span id="prog">Counted ${filled} of ${S.items.length}</span><span style="display:flex;gap:6px"><button id="bClr">Clear</button><button class="pri" id="bApply">✔ Apply count</button></span></div>`;
  const g=groups(list);
  if(!g.length)h+='<div class="empty">No matching items</div>';
  g.forEach(x=>{h+=`<div class="gh">${esc(x.c.name)}</div>`+x.items.map(it=>{
    const v=draft[it.id]!==undefined?draft[it.id]:'';
    return `<div class="crow ${v!==''?'done':''}" data-id="${it.id}"><div class="top" style="cursor:default">${info(it)}</div>
    <div class="cnt"><span class="sys">System: <b>${it.qty}</b></span><input class="cin" type="number" inputmode="decimal" placeholder="${it.qty}" value="${esc(v)}"><span class="diff"></span></div></div>`}).join('')});
  if(S.log.length){h+='<div class="log"><div class="gh">Recent counts</div>'+S.log.slice(0,6).map(l=>`<details><summary>${fmtD(l.d)} — ${l.cnt} items counted, ${l.ch.length} changed</summary>${l.ch.length?l.ch.map(c=>`<div>${esc(c.n)}: ${c.o} ← <b>${c.w}</b></div>`).join(''):'<div>No differences</div>'}</details>`).join('')+'</div>'}
  return h;
}

function needHTML(){
  const l=S.items.filter(i=>['low','out'].includes(status(i)));
  if(!l.length)return '<div class="empty">No shortages right now 👌</div>';
  l.forEach(i=>{if(order[i.id]===undefined)order[i.id]=sug(i)||''});
  let h=`<div class="note">Suggested = quantity needed to reach double the minimum. Edit the numbers as needed before copying the list.</div>
  <div class="sticky"><span>${l.length} items short</span><button class="pri" id="bCopyNeed">📋 Copy order list</button></div>`;
  h+=l.map(it=>{const st=status(it);return `<div class="crow" data-id="${it.id}" style="border-inline-start:6px solid var(${st==='out'?'--out':'--low'})"><div class="top" style="cursor:default">${info(it)}</div>
  <div class="cnt"><div style="text-align:center"><div class="sys">In stock ${it.qty} / min ${+it.min>0?it.min:'—'}</div><span class="badge b-${st}">${LBL[st]}</span></div><div><div class="sys">Order</div><input class="oin" type="number" inputmode="decimal" value="${order[it.id]}"></div></div></div>`}).join('');
  return h;
}

function render(){renderStats();renderChips();renderTabs();const v=$('#view');v.innerHTML=ui.view==='stock'?stockHTML():ui.view==='count'?countHTML():needHTML()}

/* ---------- modal helpers ---------- */
function openM(html){$('#mdl').innerHTML=html;$('#ov').classList.add('on')}
function closeM(){$('#ov').classList.remove('on');$('#mdl').innerHTML=''}
$('#ov').addEventListener('click',e=>{if(e.target.id==='ov')closeM()});
function confirmM(msg,fn,okLabel){openM(`<h3>Confirm</h3><p>${msg}</p><div class="mbtns"><button id="cNo">Cancel</button><button class="pri" id="cYes">${okLabel||'Confirm'}</button></div>`);$('#cNo').onclick=closeM;$('#cYes').onclick=()=>{closeM();fn()}}
function textM(title,text){openM(`<h3>${title}</h3><textarea id="tx" rows="12" >${esc(text)}</textarea><div class="mbtns"><button id="tClose">Close</button><button class="pri" id="tCopy">Copy</button></div>`);
  $('#tClose').onclick=closeM;$('#tCopy').onclick=()=>{const t=$('#tx');t.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}
    if(!ok&&navigator.clipboard){navigator.clipboard.writeText(t.value).then(()=>toast('Copied'),()=>toast('Select the text and copy manually'));return}
    toast(ok?'Copied':'Select the text and copy manually')}}

/* ---------- add / edit ---------- */
let editImg='';
function openEdit(id){
  const it=id?S.items.find(i=>i.id===id):{cat:ui.cat!=='all'?ui.cat:S.cats[0].id,name:'',ar:'',size:'',unit:'',brand:'',qty:0,min:0,img:'',note:''};
  editImg=it.img||'';
  openM(`<h3>${id?'Edit item':'Add new item'}</h3>
  <div class="fld"><label>Item photo</label><div class="imgrow"><div id="ipv">${thumb({img:editImg},'th')}</div><div style="flex:1;display:flex;gap:6px;flex-wrap:wrap"><label class="pri" style="display:inline-block;cursor:pointer;border-radius:10px;padding:8px 12px;background:var(--accent);color:var(--accent-t);margin:0">Choose / Take photo<input type="file" id="fimg" accept="image/*" style="display:none"></label><button id="rimg" type="button">Remove photo</button></div></div></div>
  <div class="fld"><label>Item name</label><input id="f_name" value="${esc(it.name)}"></div>
  <div class="fld"><label>Common name (Arabic)</label><input id="f_ar" value="${esc(it.ar)}"></div>
  <div class="two"><div class="fld"><label>Size</label><input id="f_size" value="${esc(it.size)}"></div><div class="fld"><label>Unit (Qty/UNIT)</label><input id="f_unit" value="${esc(it.unit)}"></div></div>
  <div class="fld"><label>Brand</label><input id="f_brand" value="${esc(it.brand)}"></div>
  <div class="two"><div class="fld"><label>Current quantity</label><input id="f_qty" type="number" inputmode="decimal" value="${it.qty}"></div><div class="fld"><label>Minimum</label><input id="f_min" type="number" inputmode="decimal" value="${it.min}"></div></div>
  <div class="fld"><label>Category</label><select id="f_cat">${S.cats.map(c=>`<option value="${c.id}" ${c.id===it.cat?'selected':''}>${esc(c.name)}</option>`).join('')}<option value="__new">＋ New category...</option></select></div>
  <div class="fld" id="newcatw" style="display:none"><label>New category name</label><input id="f_newcat"></div>
  <div class="fld"><label>Notes</label><input id="f_note" value="${esc(it.note||'')}"></div>
  <div class="mbtns"><span>${id?'<button class="dan" id="eDel">Delete</button>':''}</span><span style="display:flex;gap:8px"><button id="eNo">Cancel</button><button class="pri" id="eSave">Save</button></span></div>`);
  $('#f_cat').onchange=e=>{$('#newcatw').style.display=e.target.value==='__new'?'':'none'};
  $('#eNo').onclick=closeM;
  $('#rimg').onclick=()=>{editImg='';$('#ipv').innerHTML=thumb({img:''},'th')};
  $('#fimg').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const M=320,k=Math.min(1,M/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);editImg=c.toDataURL('image/jpeg',.75);$('#ipv').innerHTML=thumb({img:editImg},'th')};im.src=r.result};r.readAsDataURL(f)};
  if(id)$('#eDel').onclick=()=>confirmM('Delete this item permanently?',()=>{S.items=S.items.filter(i=>i.id!==id);save();render();toast('Item deleted')},'Delete');
  $('#eSave').onclick=()=>{
    const name=$('#f_name').value.trim();if(!name){toast('Enter item name');return}
    let cat=$('#f_cat').value;
    if(cat==='__new'){const n=$('#f_newcat').value.trim();if(!n){toast('Enter category name');return}cat='c'+Date.now().toString(36);S.cats.push({id:cat,name:n})}
    const num=v=>{const n=parseFloat(v);return isNaN(n)?0:n};
    const d={cat,name,ar:$('#f_ar').value.trim(),size:$('#f_size').value.trim(),unit:$('#f_unit').value.trim(),brand:$('#f_brand').value.trim(),qty:num($('#f_qty').value),min:num($('#f_min').value),note:$('#f_note').value.trim(),img:editImg};
    if(id)Object.assign(S.items.find(i=>i.id===id),d);else S.items.push(Object.assign({id:nid(),counted:''},d));
    save();closeM();render();toast('Saved');
  };
}

/* ---------- backup ---------- */
/* ---------- file sync (OneDrive folder) ---------- */
const FSA=('showSaveFilePicker' in window)&&('showOpenFilePicker' in window);
const JT=[{description:'JSON file',accept:{'application/json':['.json']}}];
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('iat_stock_h',1);r.onupgradeneeded=()=>r.result.createObjectStore('h');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function hget(){try{const db=await idb();return await new Promise(res=>{const q=db.transaction('h').objectStore('h').get('file');q.onsuccess=()=>res(q.result);q.onerror=()=>res(null)})}catch(e){return null}}
async function hset(h){try{const db=await idb();db.transaction('h','readwrite').objectStore('h').put(h,'file')}catch(e){}}
function markSaved(name){localStorage.setItem('iat_stock_filesaved',S.modified||new Date().toISOString());if(name)localStorage.setItem('iat_stock_filename',name);renderSync()}
function payload(){if(!S.modified){S.modified=new Date().toISOString();persist()}return JSON.stringify({app:'iat-stock',savedAt:S.modified,data:S})}
function confirmP(msg,label){return new Promise(res=>{confirmM(msg,()=>res(true),label);$('#cNo').onclick=()=>{closeM();res(false)}})}
async function getHandle(mode){ // stored file handle with permission, or null
  const h=await hget();if(!h)return null;
  try{let q=await h.queryPermission({mode});if(q!=='granted')q=await h.requestPermission({mode});return q==='granted'?h:null}catch(e){return null}
}
async function saveFile(pick){
  const p=payload();
  if(FSA){
    try{
      let h=pick?null:await getHandle('readwrite');
      if(h){ // safety: is the file in OneDrive newer than what this device last synced?
        try{const o=JSON.parse(await (await h.getFile()).text());const fa=o.savedAt||'';const last=localStorage.getItem('iat_stock_filesaved')||'';
          if(fa&&fa>last&&fa!==S.modified){const ok=await confirmP(`The file was updated on another device (<b>${fmtT(fa)}</b>) after this device last synced.<br>Saving now will overwrite those changes.<br><br>Overwrite the file anyway?`,'Overwrite');if(!ok)return}
        }catch(e){}
      }
      if(!h){h=await window.showSaveFilePicker({suggestedName:'iat-stock.json',types:JT});await hset(h)}
      const w=await h.createWritable();await w.write(p);await w.close();
      markSaved(h.name);toast('Saved to '+h.name);return;
    }catch(e){if(e&&e.name==='AbortError')return}
  }
  const bl=new Blob([p],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download='iat-stock.json';document.body.appendChild(a);a.click();a.remove();
  markSaved('iat-stock.json');toast('File downloaded – move it to your OneDrive folder');
}
async function loadFile(pick){
  if(FSA){
    try{
      let h=pick?null:await getHandle('read');
      if(!h){[h]=await window.showOpenFilePicker({types:JT});await hset(h)}
      const f=await h.getFile();localStorage.setItem('iat_stock_filename',h.name);applyLoaded(await f.text());return;
    }catch(e){if(e&&e.name==='AbortError')return;if(!pick&&e&&e.name==='NotFoundError'){toast('Saved file not found – choose it again');await hset(null);return loadFile(true)}}
  }
  const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';
  inp.onchange=()=>{const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>applyLoaded(r.result);r.readAsText(f)};inp.click();
}
function applyLoaded(text){
  let o;try{o=JSON.parse(text)}catch(e){toast('This is not a valid backup file');return}
  const d=o&&o.data?o.data:o;const savedAt=o&&o.savedAt||d&&d.modified||'';
  if(!d||!Array.isArray(d.items)||!Array.isArray(d.cats)){toast('This is not a valid stock file');return}
  const older=savedAt&&S.modified&&savedAt<S.modified;
  confirmM(`File saved: <b>${savedAt?fmtT(savedAt):'unknown date'}</b><br>This device: <b>${fmtT(S.modified)}</b><br><br>${older?'<b style="color:var(--out)">⚠ This file is OLDER than the data on this device.</b><br>':''}Loading will replace everything on this device. Continue?`,()=>{
    S=d;if(!S.log)S.log=[];draft={};order={};if(savedAt)S.modified=savedAt;persist();localStorage.setItem('iat_stock_filesaved',savedAt||new Date().toISOString());closeM();render();toast('Loaded')},'Load');
}
function openBackup(){
  const fn=localStorage.getItem('iat_stock_filename');
  openM(`<h3>⚙ File settings</h3>
  <div class="note">${FSA?'The first time on a device you choose the file inside your OneDrive folder. After that, <b>Save</b> and <b>Load</b> always use that same file with no questions.':'This browser can’t keep a link to a file, so Save downloads the file (move it into OneDrive) and Load asks you to pick it. Use Chrome or Edge on the PC for one-tap Save/Load.'}</div>
  <div style="margin-bottom:10px">Current file: <b>${fn?esc(fn):'not chosen yet'}</b></div>
  ${FSA?'<div class="mbtns" style="margin-top:0"><button id="sPick">Choose a different file to Save to…</button><button id="sPickL">Choose a different file to Load…</button></div>':''}
  <details style="margin-top:12px"><summary>Advanced: copy / paste backup text</summary>
  <textarea id="bk" rows="6" style="font-size:12px;margin-top:8px">${esc(JSON.stringify(S))}</textarea>
  <div class="mbtns"><button id="bCopy">Copy</button><button id="bRest">Restore from text</button></div>
  <div class="mbtns"><button class="dan" id="bReset">Reset to original Excel data</button></div></details>
  <div class="mbtns"><span></span><button id="bClose">Close</button></div>`);
  $('#bClose').onclick=closeM;
  if($('#sPick'))$('#sPick').onclick=()=>{closeM();saveFile(true)};
  if($('#sPickL'))$('#sPickL').onclick=()=>{closeM();loadFile(true)};
  $('#bCopy').onclick=()=>{const t=$('#bk');t.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}toast(ok?'Copied':'Select the text and copy manually')};
  $('#bRest').onclick=()=>applyLoaded($('#bk').value);
  $('#bReset').onclick=()=>confirmM('All items and quantities return to the original Excel data (25/09/2026) and your edits are lost.',()=>{S=seed();draft={};order={};save();closeM();render();toast('Reset done')},'Reset');
}

/* ---------- print ---------- */
function printSheet(){
  const g=groups(S.items);let n=0;
  let h=`<h2>Stock Count Sheet – IAT Trading</h2><div class="pm">Printed: ${fmtD(today())} &nbsp;|&nbsp; Last count: ${fmtD(S.lastCount)} &nbsp;|&nbsp; Counted by: ____________________</div>`;
  g.forEach(x=>{
    h+=`<h4>${esc(x.c.name)}</h4><table><tr><th style="width:24px">#</th><th style="width:34px">Photo</th><th>Item</th><th>Common name</th><th>Size</th><th>Unit</th><th>Brand</th><th style="width:52px">System</th><th style="width:44px">Min</th><th style="width:70px">Actual count</th><th style="width:110px">Notes</th></tr>`;
    x.items.forEach(it=>{n++;h+=`<tr><td>${n}</td><td>${it.img?`<img src="${it.img}">`:''}</td><td class="l">${esc(it.name)}</td><td class="l">${esc(it.ar)}</td><td>${esc(it.size)}</td><td>${esc(it.unit)}</td><td>${esc(it.brand)}</td><td><b>${it.qty}</b></td><td>${+it.min>0?it.min:''}</td><td></td><td></td></tr>`});
    for(let i=0;i<2;i++)h+=`<tr class="blank">${'<td></td>'.repeat(11)}</tr>`;
    h+='</table>';
  });
  $('#printArea').innerHTML=h;
  try{window.print()}catch(e){toast('Print failed, try the browser menu')}
}

/* ---------- events ---------- */
$('#stats').addEventListener('click',e=>{const s=e.target.closest('.stat');if(!s)return;const f=s.dataset.f;ui.filter=(ui.filter===f&&f!=='all')?'all':f;if(ui.view!=='stock')ui.view='stock';render()});
$('#chips').addEventListener('click',e=>{const c=e.target.closest('.chip');if(!c)return;ui.cat=c.dataset.c;render()});
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;ui.view=b.dataset.v;render()});
$('#q').addEventListener('input',e=>{ui.q=e.target.value;if(ui.view!=='need')$('#view').innerHTML=ui.view==='stock'?stockHTML():countHTML()});
$('#bAdd').onclick=()=>openEdit(null);
$('#bPrint').onclick=printSheet;
$('#bBackup').onclick=openBackup;
$('#bSave').onclick=()=>saveFile(false);
$('#bLoad').onclick=()=>loadFile(false);

const view=$('#view');
view.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');
  if(t){const card=t.closest('[data-id]');if(!card)return;const it=S.items.find(i=>i.id===card.dataset.id);if(!it)return;
    if(t.dataset.act==='edit')openEdit(it.id);
    else{it.qty=Math.max(0,(+it.qty||0)+(t.dataset.act==='plus'?1:-1));save();render()}
    return}
  if(e.target.id==='bApply')applyCount();
  if(e.target.id==='bClr'){draft={};render()}
  if(e.target.id==='bCopyNeed'){
    const l=S.items.filter(i=>['low','out'].includes(status(i))&&(parseFloat(order[i.id])>0));
    if(!l.length){toast('No order quantities');return}
    textM('Order list',`Packaging materials order – ${fmtD(today())}\n\n`+l.map(i=>`• ${i.name}${i.ar?' ('+i.ar+')':''}${i.size?' – '+i.size:''}: ${order[i.id]}`).join('\n'))}
});
view.addEventListener('change',e=>{
  if(e.target.classList.contains('qin')){const it=S.items.find(i=>i.id===e.target.closest('[data-id]').dataset.id);const n=parseFloat(e.target.value);if(!isNaN(n)&&n>=0){it.qty=n;save()}render()}
});
view.addEventListener('input',e=>{
  const row=e.target.closest('[data-id]');if(!row)return;const id=row.dataset.id;
  if(e.target.classList.contains('cin')){
    draft[id]=e.target.value;const it=S.items.find(i=>i.id===id);const d=row.querySelector('.diff');const v=parseFloat(e.target.value);
    if(e.target.value===''||isNaN(v)){d.textContent='';d.className='diff';row.classList.remove('done')}
    else{const x=v-it.qty;d.textContent=x>0?'+'+x:(x<0?String(x):'=');d.className='diff '+(x>0?'p':x<0?'n':'');row.classList.add('done')}
    const f=Object.keys(draft).filter(k=>draft[k]!==''&&!isNaN(parseFloat(draft[k]))).length;const p=$('#prog');if(p)p.textContent=`Counted ${f} of ${S.items.length}`;
  }
  if(e.target.classList.contains('oin'))order[id]=e.target.value;
});

function applyCount(){
  const ids=Object.keys(draft).filter(k=>draft[k]!==''&&!isNaN(parseFloat(draft[k])));
  if(!ids.length){toast('No quantities entered');return}
  confirmM(`${ids.length} items will be updated with the quantities you entered. Continue?`,()=>{
    const ch=[];ids.forEach(id=>{const it=S.items.find(i=>i.id===id);if(!it)return;const n=parseFloat(draft[id]);if(n!==it.qty)ch.push({n:it.name+(it.ar?' ('+it.ar+')':''),o:it.qty,w:n});it.qty=n;it.counted=today()});
    S.lastCount=today();S.log.unshift({d:today(),cnt:ids.length,ch});S.log=S.log.slice(0,30);draft={};order={};save();render();toast('Count applied')},'Apply');
}

load();render();
</script>
